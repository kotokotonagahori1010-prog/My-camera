
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Camera</title>
  <style>
    body {
      background: #202020;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      background: black;
    }

    button {
      font-size: 18px;
      padding: 14px 24px;
      margin: 10px;
      border: none;
      border-radius: 12px;
    }

    #capture {
      background: white;
      color: black;
    }

    #start {
      background: #66aaff;
      color: black;
    }

    img {
      width: 100%;
      max-width: 400px;
      margin-top: 16px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <h1>My Camera 📸</h1>

  <video id="video" autoplay playsinline></video>

  <br>

  <button id="start">カメラを起動</button>
  <button id="capture">撮影する</button>

  <canvas id="canvas" hidden></canvas>

  <h2>撮影した写真</h2>
  <img id="photo" alt="撮影した写真">

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const photo = document.getElementById("photo");

    document.getElementById("start").onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
      } catch (error) {
        alert("カメラを起動できませんでした: " + error.message);
      }
    };

    document.getElementById("capture").onclick = () => {
      if (!video.videoWidth) {
        alert("先にカメラを起動してね！");
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      canvas.getContext("2d").drawImage(
        video, 0, 0, canvas.width, canvas.height
      );

      photo.src = canvas.toDataURL("image/jpeg", 0.95);
    };
  </script>
</body>
</html>
